<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Epic Gift</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header class="topbar">

    <button class="icon-btn close">×</button>

    <div class="brand">

      <div class="brand-art">
        <div class="brand-gift"></div>
      </div>

      <div>
        <div class="brand-name">Epic Gift</div>
        <div class="brand-sub">GIFTS • GAMES • REWARDS</div>
      </div>

    </div>

    <button class="icon-btn menu">•••</button>

  </header>


  <main>

    <section class="balance-card">

      <div class="profile-art">
        <div class="profile-ring"></div>
        <div class="profile-face"></div>
      </div>

      <div class="balance-info">
        <span>Your balance</span>
        <strong>0.006</strong>
        <small>TON</small>
      </div>

      <button class="deposit">
        Deposit
      </button>

    </section>


    <section class="live-section">

      <div class="section-title">
        <span class="live-dot"></span>
        LIVE
      </div>

      <div class="live-row">

        <div class="live-card gift-art art-purple"></div>
        <div class="live-card gift-art art-blue"></div>
        <div class="live-card gift-art art-pink"></div>
        <div class="live-card gift-art art-gold"></div>
        <div class="live-card gift-art art-red"></div>

      </div>

    </section>


    <section class="hero-grid">

      <button class="mode-card rocket-banner">

        <div class="mode-glow"></div>

        <div class="rocket-art">
          <div class="rocket-body"></div>
          <div class="rocket-window"></div>
          <div class="rocket-flame"></div>
        </div>

        <div class="mode-copy">
          <span>PLAY MODE</span>
          <strong>ROCKET</strong>
          <small>Cash out before the crash</small>
        </div>

        <div class="mode-arrow">›</div>

      </button>


      <button class="mode-card pvp-banner">

        <div class="pvp-art">

          <div class="pvp-orb left"></div>
          <div class="pvp-orb right"></div>
          <div class="pvp-sword"></div>

        </div>

        <div class="mode-copy">
          <span>BATTLE MODE</span>
          <strong>PVP</strong>
          <small>Fight for the bank</small>
        </div>

        <div class="mode-arrow">›</div>

      </button>

    </section>


    <button class="play-banner">

      <div class="play-icon">
        <div class="play-triangle"></div>
      </div>

      <div>
        <span>DISCOVER</span>
        <strong>PLAY HUB</strong>
      </div>

      <div class="play-arrow">›</div>

    </button>


    <section class="boxes-section">

      <div class="section-heading">
        <strong>Gift Boxes</strong>
        <span>View all</span>
      </div>


      <div class="boxes-grid">

        <button class="box-card free24">

          <div class="box-art free-art">

            <div class="box-lid"></div>
            <div class="box-body"></div>
            <div class="box-ribbon"></div>

          </div>

          <strong>FREE24</strong>
          <span>Every 24 hours</span>

        </button>


        <button class="box-card free">

          <div class="box-art farm-art">

            <div class="farm-box"></div>
            <div class="farm-leaf one"></div>
            <div class="farm-leaf two"></div>

          </div>

          <strong>FARM</strong>
          <span>Any gift can drop</span>

        </button>


        <button class="box-card">

          <div class="gift-object heart-object"></div>

          <strong>HEART</strong>
          <span>Special collection</span>

        </button>


        <button class="box-card">

          <div class="gift-object ring-object"></div>

          <strong>RING</strong>
          <span>Rare gifts</span>

        </button>


        <button class="box-card">

          <div class="gift-object crown-object"></div>

          <strong>VIP</strong>
          <span>Premium rewards</span>

        </button>


        <button class="box-card">

          <div class="gift-object gem-object"></div>

          <strong>ELITE</strong>
          <span>High value drops</span>

        </button>

      </div>

    </section>

  </main>


  <nav class="bottom-nav">

    <button>
      <div class="nav-icon backpack-icon"></div>
      <span>Backpack</span>
    </button>

    <button>
      <div class="nav-icon invite-icon"></div>
      <span>Invite</span>
    </button>

    <button class="active">
      <div class="nav-icon home-icon"></div>
      <span>Home</span>
    </button>

    <button>
      <div class="nav-icon leaderboard-icon"></div>
      <span>Leaderboard</span>
    </button>

    <button>
      <div class="nav-icon earn-icon"></div>
      <span>Earn</span>
    </button>

  </nav>

</div>


<script src="app.js"></script>

</body>
</html>
