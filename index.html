<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Epic Gift</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">

<header class="topbar">
  <button class="close">× <span>Close</span></button>

  <div class="brand">
    <div class="gift-icon">♧</div>
    <b>Epic Gift</b>
  </div>

  <button class="menu">⌄ &nbsp;⋮</button>
</header>

<section class="balance">
  <div class="avatar"></div>

  <div class="balance-info">
    <span>Your balance</span>
    <strong><i>◇</i> 0.006</strong>
  </div>

  <button class="deposit">
    <span>▣</span> Deposit
  </button>
</section>

<section class="live-section">
  <div class="live-title">
    <i></i>
    <b>Live</b>
  </div>

  <div class="live-scroll">
    <div class="live-item broom"></div>
    <div class="live-item ton"></div>
    <div class="live-item bag"></div>
    <div class="live-item bag"></div>
    <div class="live-item ton"></div>
    <div class="live-item gift"></div>
  </div>
</section>

<main>

  <section class="banner rocket-banner">
    <div class="hot">ϟ HOT!</div>
    <div class="rocket-title">♧ ROCKET</div>

    <div class="rocket-art">
      <div class="rocket-body">◈</div>
      <span class="mult m1">x4.97</span>
      <span class="mult m2">x3.08</span>
      <span class="mult m3">x1.74</span>
    </div>
  </section>

  <section class="banner pvp-banner">
    <div class="pvp-title">⚔ PVP</div>

    <div class="players">
      <div class="player">
        <div class="player-img one"></div>
        <b>DEGEN</b>
        <span>3.8%</span>
      </div>

      <div class="player active-player">
        <div class="player-img two"></div>
        <b>MIKE_K</b>
        <span>7.6%</span>
      </div>

      <div class="player">
        <div class="player-img three"></div>
        <b>TONNER</b>
        <span>63.0%</span>
      </div>
    </div>
  </section>

  <section class="banner play-banner">
    <div class="hot">♨ HOT</div>
    <div class="play-title">⌁ PLAY HUB</div>

    <div class="games">
      <div class="game green">↗</div>
      <div class="game purple">•••</div>
      <div class="game blue">▦</div>
    </div>
  </section>

  <section class="free-grid">

    <div class="free-card free24">
      <div class="free-title">FREE<span>24</span></div>
      <div class="ring">◉</div>
    </div>

    <div class="free-card free">
      <div class="free-title">FREE</div>
      <div class="free-art">●</div>
    </div>

  </section>

</main>

<nav class="bottom-nav">

  <button>
    <div>◇</div>
    <span>Backpack</span>
  </button>

  <button>
    <div>♙</div>
    <span>Invite</span>
  </button>

  <button class="active">
    <div>⌂</div>
    <span>Home</span>
  </button>

  <button>
    <div>♜</div>
    <span>Leaderboard</span>
  </button>

  <button>
    <div>◉</div>
    <span>Earn</span>
  </button>

</nav>

</div>

<script src="app.js"></script>
</body>
</html>
