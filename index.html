<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Epic Gift</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div id="app">

<header class="header">
  <button class="close">× <small>Close</small></button>
  <div class="logo">🎁 <b>Epic Gift</b></div>
  <button class="more">⌄ ⋮</button>
</header>

<section class="balance">
  <div class="avatar">👤</div>

  <div class="balance-info">
    <span>Your balance</span>
    <b>💎 0.006</b>
  </div>

  <button class="deposit">▣ &nbsp; Deposit</button>
</section>

<section class="live">
  <div class="live-label">
    <i></i>
    <b>Live</b>
  </div>

  <div class="live-list">
    <div>🧹</div>
    <div>💎</div>
    <div>🎒</div>
    <div>🎒</div>
    <div>💎</div>
    <div>🎁</div>
  </div>
</section>

<main>

<section class="hero-card rocket">
  <div class="hero-text">
    <label>⚡ HOT!</label>
    <h1>🚀 ROCKET</h1>
  </div>
  <div class="hero-image">🚀</div>
</section>

<section class="hero-card pvp">
  <div class="pvp-title">⚔️ <b>PVP</b></div>

  <div class="pvp-users">
    <div>DEGEN<strong>3.8%</strong></div>
    <div>👤 MIKE_K<strong>7.6%</strong></div>
    <div>TONNER<strong>63.0%</strong></div>
  </div>
</section>

<section class="hero-card play">
  <div>
    <label>🔥 HOT</label>
    <h1>🎮 PLAY HUB</h1>
  </div>
  <div class="play-games">🟢 🟣 🔵</div>
</section>

<section class="free-grid">
  <div class="free-card gold">
    <div>💍</div>
    <b>FREE24</b>
    <span>FREE REWARDS</span>
  </div>

  <div class="free-card purple">
    <div>🍭🍄</div>
    <b>FREE</b>
    <span>FREE REWARDS</span>
  </div>
</section>

<section class="contracts">
  <h2>YOUR CONTRACTS</h2>

  <div class="contract">
    <div>
      <b>200 POWER</b>
      <span>Expires in 1d 0h</span>
    </div>
    <strong>130 HASHES/day</strong>

    <div class="bar"><i></i></div>
  </div>
</section>

<div id="page" class="hidden"></div>

</main>

<nav class="nav">
  <button data-page="backpack">📦<span>BACKPACK</span></button>
  <button data-page="team">👥<span>INVITE</span></button>
  <button class="home active" data-page="home">⌂<span>HOME</span></button>
  <button data-page="trophy">🏆<span>LEADERBOARD</span></button>
  <button data-page="earn">🪙<span>EARN</span></button>
</nav>

</div>

<script src="app.js"></script>
</body>
</html>
