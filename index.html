<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epic Gift</title>

  <link rel="stylesheet" href="style.css?v=6">
</head>

<body>

<div class="app">

  <header class="topbar">
    <button class="close">✕ Close</button>

    <div class="brand">
      <div class="gift-icon">🎁</div>
      <strong>Epic Gift</strong>
    </div>

    <button class="menu">⌄ Menu</button>
  </header>


  <section class="balance">

    <div class="avatar"></div>

    <div class="balance-info">
      <span>Your balance</span>
      <strong><i>◆</i> 0.006</strong>
    </div>

    <button class="deposit">Deposit</button>

  </section>


  <section class="live-section">

    <div class="live-title">
      <i></i>
      <span>Live</span>
    </div>

    <div class="live-scroll">
      <div class="live-item"></div>
      <div class="live-item ton"></div>
      <div class="live-item broom"></div>
      <div class="live-item bag"></div>
      <div class="live-item gift"></div>
      <div class="live-item"></div>
    </div>

  </section>


  <main>

    <section class="banner rocket-banner">

      <div class="hot">🔥 HOT</div>

      <div class="rocket-title">
        Rocket
      </div>

      <div class="rocket-art">

        <div class="mult m1">x2</div>
        <div class="mult m2">x5</div>
        <div class="mult m3">x10</div>

        <div class="rocket-body">
          🚀
        </div>

      </div>

    </section>


    <section class="banner pvp-banner">

      <div class="pvp-title">
        ⚔ PVP
      </div>

      <div class="players">

        <div class="player active-player">
          <div class="player-img"></div>
          <b>Player 1</b>
          <span>52%</span>
        </div>

        <div class="player">
          <div class="player-img two"></div>
          <b>Player 2</b>
          <span>31%</span>
        </div>

        <div class="player">
          <div class="player-img three"></div>
          <b>Player 3</b>
          <span>17%</span>
        </div>

      </div>

    </section>


    <section class="banner play-banner">

      <div class="hot">PLAY</div>

      <div class="play-title">
        Play Hub
      </div>

      <div class="games">

        <div class="game green">♟</div>
        <div class="game purple">★</div>
        <div class="game blue">⚡</div>

      </div>

    </section>


    <section class="free-grid">

      <div class="free-card free24">

        <div class="free-title">
          FREE <span>24H</span>
        </div>

        <div class="ring">
          🎁
        </div>

      </div>


      <div class="free-card free">

        <div class="free-title">
          FREE
        </div>

        <div class="free-art">
          🎁
        </div>

      </div>

    </section>

  </main>

</div>


<nav class="bottom-nav">

  <button>
    <div>🎒</div>
    <span>Backpack</span>
  </button>

  <button>
    <div>👥</div>
    <span>Invite</span>
  </button>

  <button class="active">
    <div>⌂</div>
    <span>Home</span>
  </button>

  <button>
    <div>🏆</div>
    <span>Leaderboard</span>
  </button>

  <button>
    <div>⚡</div>
    <span>Earn</span>
  </button>

</nav>


<script src="app.js?v=2"></script>

</body>
</html>
